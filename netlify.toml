# Netlify settings for The Scene.
# In Netlify → Site configuration → Environment variables, add:
#   TICKETMASTER_KEY        (server only; do NOT add VITE_TICKETMASTER_KEY on Netlify)
#   GOOGLE_PLACES_KEY       (server only; venue photos for events without their own picture)
#   VITE_SITE_URL           e.g. https://thescene.app (used in shared links)
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY   (optional, accounts)
#   VITE_SUPPORT_EMAIL      (optional, report emails)
#   VITE_SENTRY_DSN         (optional, error tracking)

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The landing page is / (index.html). The app is /app/; its tabs and event
# links (/e/<id>) all load the app.
[[redirects]]
  from = "/e/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
